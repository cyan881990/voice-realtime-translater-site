<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Realtime Translater</title>
<link rel="icon" href="logo.svg">
<style>
  :root { --bg:#F6F7F9; --text:#141A21; --muted:#5B6673; --accent:#9A5B00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0E141B; --text:#EEF2F6; --muted:#9AA8B6; --accent:#F5A524; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; text-align:center; }
  img { width: 112px; height: 112px; }
  h1 { font-size: 30px; margin: 20px 0 8px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="logo.svg" alt="Voice Realtime Translater logo">
  <h1>Voice Realtime Translater</h1>
  <p>Two-way conversation translator that runs on your phone. Speak either language, it detects which one and translates to the other, offline and free.</p>
  <p><a href="privacy.html">Privacy Policy</a> · <a href="privacy.html#vi">Chính sách bảo mật</a></p>
</main>
</body>
</html>
